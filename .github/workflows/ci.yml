name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.cmd

      - name: Self-test
        shell: pwsh
        run: |
          $p = Start-Process bin\WslTray.exe -ArgumentList '--selftest' -Wait -PassThru -RedirectStandardOutput selftest.txt
          Get-Content selftest.txt
          exit $p.ExitCode

      - uses: actions/upload-artifact@v4
        with:
          name: WslTray
          path: bin/WslTray.exe
